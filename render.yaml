services:
  - type: web
    name: ralphguard-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.backend.prod
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ralphguard-db
          property: connectionString
      - key: API_SECRET_KEY
        generateValue: true
      - key: AUTH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MODELS_DIR
        value: /models
      - key: SCIENTIFIC_RUNTIME_DIR
        value: /scientific
      - key: ASSESSMENT_EXECUTION_MODE
        value: inline
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

databases:
  - name: ralphguard-db
    plan: free
    region: singapore
    databaseName: ralphguard
    user: ralphguard
    postgresMajorVersion: "16"
    ipAllowList: []
