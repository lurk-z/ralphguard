services:
  - type: web
    name: ralphguard-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile.backend.prod
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ralphguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ralphguard-redis
          type: keyvalue
          property: connectionString
      - key: API_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: MODELS_DIR
        value: /models
      - key: QUEUE_STREAM_NAME
        value: ralphguard:jobs
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  - type: worker
    name: ralphguard-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile.worker.prod
    dockerContext: ./scientific
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ralphguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ralphguard-redis
          type: keyvalue
          property: connectionString
      - key: MODELS_DIR
        value: /app/models
      - key: QUEUE_STREAM_NAME
        value: ralphguard:jobs

  - type: keyvalue
    name: ralphguard-redis
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: ralphguard-db
    plan: basic-256mb
    region: singapore
    databaseName: ralphguard
    user: ralphguard
    postgresMajorVersion: "16"
    ipAllowList: []
