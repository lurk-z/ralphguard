services:
  # -------------- PostgreSQL --------------
  postgres:
    image: postgres:16-alpine
    container_name: ralphguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ralphguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ralphguard_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ralphguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ralphguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------- Redis --------------
  redis:
    image: redis:7-alpine
    container_name: ralphguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------- Backend API --------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ralphguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ralphguard}:${POSTGRES_PASSWORD:-ralphguard_dev}@postgres:5432/${POSTGRES_DB:-ralphguard}
      REDIS_URL: redis://redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MODELS_DIR: /models
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scientific/models:/models:ro
      # NICE/ICE collectors run in the backend container and write staging/
      # curated evidence under /data. Bind it to the repository so the
      # scientific candidate-training scripts see the same files.
      - ./data:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # -------------- Scientific Worker --------------
  worker:
    build:
      context: ./scientific
      dockerfile: Dockerfile
    container_name: ralphguard-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ralphguard}:${POSTGRES_PASSWORD:-ralphguard_dev}@postgres:5432/${POSTGRES_DB:-ralphguard}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./scientific:/app
      - ./data:/data
    command: python worker.py

  # -------------- Reproducible QSAR Trainer --------------
  # Not started by normal `docker compose up`. Use the `training` profile for
  # audits/candidate retraining so RDKit/scikit-learn versions match the
  # scientific image and the repository is mounted read/write for reports.
  trainer:
    profiles: ["training"]
    build:
      context: ./scientific
      dockerfile: Dockerfile
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ralphguard}:${POSTGRES_PASSWORD:-ralphguard_dev}@postgres:5432/${POSTGRES_DB:-ralphguard}
    volumes:
      - ./:/workspace
    command: python scripts/train_candidate_v2.py

  # -------------- Official NICE/ICE bulk data preparation --------------
  # Downloads the four curated experimental/reference workbooks, applies the
  # documented conservative binary mappings, and refuses success unless at
  # least 10,000 unique endpoint rows remain after conflict filtering.
  ice-data-prep:
    profiles: ["training"]
    build:
      context: ./scientific
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >
      python scripts/prepare_ice_bulk_training.py
      --download
      --min-total 10000

volumes:
  postgres-data:
  redis-data:
